name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (linter)
        run: ruff check . --output-format=github

      - name: Run Ruff (format check)
        run: ruff format --check .


  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest pytest-cov pytest-asyncio anyio \
            httpx \
            pydantic>=2.0.0 \
            python-dotenv \
            loguru \
            logfire \
            docling \
            trafilatura \
            google-genai \
            qdrant-client[fastembed] \
            rank-bm25 \
            numpy \
            ascii_colors \
            tiktoken \
            google-cloud-storage \
            flashrank \
            langchain-text-splitters \
            fastapi \
            uvicorn[standard] \
            tenacity \
            redis \
            langgraph \
            langchain \
            psycopg[binary] \
            psycopg-pool \
            groq

      - name: Install project in editable mode
        run: pip install -e .

      - name: Create minimal .env for CI
        run: |
          cat > .env <<'EOF'
          PROJECT_NAME=studious-ci
          PORT=8000
          HOST=localhost
          CORS_ORIGINS=*
          REDIS_URL=redis://localhost:6379
          QDRANT_COLLECTION_NAME=rag_docs
          EMBEDDING_DIMENSIONS=256
          EMBEDDING_BATCH_SIZE=10
          CHUNK_SIZE=512
          CHUNK_OVERLAP=64
          MODEL_CONTEXT_LIMIT=128000
          MAX_OUTPUT_TOKENS=2048
          MAX_PROMPT_OVERHEAD_TOKENS=1024
          MAX_QUERY_INPUT_TOKENS=512
          MAX_CONTEXT_CHARS=100000
          EOF

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest pytest-asyncio anyio \
            httpx \
            pydantic>=2.0.0 \
            python-dotenv \
            loguru \
            logfire \
            docling \
            trafilatura \
            google-genai \
            qdrant-client[fastembed] \
            rank-bm25 \
            numpy \
            ascii_colors \
            tiktoken \
            google-cloud-storage \
            flashrank \
            langchain-text-splitters \
            fastapi \
            uvicorn[standard] \
            tenacity \
            redis \
            langgraph \
            langchain \
            psycopg[binary] \
            psycopg-pool \
            groq \
            asyncpg

      - name: Install project in editable mode
        run: pip install -e .

      - name: Create minimal .env for CI
        run: |
          cat > .env <<'EOF'
          PROJECT_NAME=studious-ci
          PORT=8000
          HOST=localhost
          CORS_ORIGINS=*
          REDIS_URL=redis://localhost:6379
          QDRANT_COLLECTION_NAME=rag_docs
          EMBEDDING_DIMENSIONS=256
          EMBEDDING_BATCH_SIZE=10
          CHUNK_SIZE=512
          CHUNK_OVERLAP=64
          MODEL_CONTEXT_LIMIT=128000
          MAX_OUTPUT_TOKENS=2048
          MAX_PROMPT_OVERHEAD_TOKENS=1024
          MAX_QUERY_INPUT_TOKENS=512
          MAX_CONTEXT_CHARS=100000
          EOF

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m integration


  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2022-42969
