services:
  postgres:
    image: postgres:15-alpine
    restart: always
    container_name: medici-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c wal_level=minimal
        -c max_wal_senders=0
        -c max_connections=50
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    container_name: medici-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 192m
        reservations:
          memory: 64m
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: medici-app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:8501,http://ui:8501

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: medici-ui
    ports:
      - "8501:8501"
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://app:8000

volumes:
  postgres_data:
